name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test production build
        run: npm test

      # Audits the whole installed tree, not just what npm labels as runtime.
      # scripts/serve.mjs serves production on Miniflare, which arrives through
      # the dev tree, so `--omit=dev` reported a clean bill of health while five
      # high-severity undici advisories sat in the request path.
      - name: Audit dependencies
        run: npm run audit:gate
